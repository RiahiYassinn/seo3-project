name: CD

# Publishes container images to Docker Hub.
#
#   push to main   -> tags: latest, main, sha-<short>
#   tag v*         -> tags: 1.2.3, 1.2, sha-<short>
#
# Images land at docker.io/<DOCKERHUB_USERNAME>/<service>.

on:
  push:
    branches: [main, prod]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Using standard Docker Hub namespace
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Re-verify the tree before anything is published.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build, test
        run: npx turbo run lint typecheck build test

  # ---------------------------------------------------------------------------
  # Build and push one image per service to Docker Hub.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: api-gateway/Dockerfile
          - image: developer-service
            dockerfile: services/developer-service/Dockerfile
          - image: skill-service
            dockerfile: services/skill-service/Dockerfile
          - image: analysis-service
            dockerfile: services/analysis-service/Dockerfile
          - image: recommendation-service
            dockerfile: services/recommendation-service/Dockerfile
          - image: notification-service
            dockerfile: services/notification-service/Dockerfile
          - image: nlp-service
            dockerfile: services/nlp-service/Dockerfile
          - image: web-client
            dockerfile: client/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

      - name: Summarize
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Deployment placeholder.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ github.event.inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    needs: [publish]
    if: |
      always() && 
      needs.publish.result == 'success' && 
      (
        github.ref == 'refs/heads/main' || 
        github.ref == 'refs/heads/prod' || 
        startsWith(github.ref, 'refs/tags/v') || 
        github.event_name == 'workflow_dispatch'
      )
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Report the images that would be deployed
        run: |
          TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          {
            echo "### Pending deployment"
            echo ""
            echo "Namespace: \`${{ env.DOCKERHUB_NAMESPACE }}\`"
            echo "Tag: \`${TAG}\`"
            echo ""
            echo "On the target host:"
            echo '```bash'
            echo "export DOCKERHUB_NAMESPACE=${{ env.DOCKERHUB_NAMESPACE }}"
            echo "export IMAGE_TAG=${TAG}"
            echo "docker compose -f docker-compose.prod.yml pull"
            echo "docker compose -f docker-compose.prod.yml up -d"
            echo '```'
            echo ""
            echo "> No deploy target is configured yet; this job only reports."
          } >> "$GITHUB_STEP_SUMMARY"
