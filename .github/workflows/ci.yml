name: CI

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Every TypeScript workspace: lint, typecheck, build, test.
  # ---------------------------------------------------------------------------
  node:
    name: Node workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Turbo skips tasks whose inputs are unchanged; the key rotates per commit
      # and falls back to the most recent cache on the same branch.
      - name: Restore turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo run lint

      - name: Typecheck
        run: npx turbo run typecheck

      - name: Build
        run: npx turbo run build

      # Coverage is written to <workspace>/coverage/lcov.info with repo-root
      # relative paths (see jest.preset.js) so the SonarQube job can consume it.
      - name: Test with coverage
        run: npx turbo run test:cov

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node
          path: |
            api-gateway/coverage/lcov.info
            client/web/coverage/lcov.info
            services/*/coverage/lcov.info
            shared/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # nlp-service is Python and sits outside the turbo task graph.
  # ---------------------------------------------------------------------------
  python:
    name: NLP service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/nlp-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/nlp-service/requirements-dev.txt

      - name: Lint (ruff)
        working-directory: services/nlp-service
        run: ruff check .

      - name: Security scan (bandit)
        working-directory: services/nlp-service
        # Low/medium findings are reported but only high severity blocks a merge.
        run: bandit -r app main.py --severity-level high

      - name: Import check
        working-directory: services/nlp-service
        run: python -c "import main; print('FastAPI app imports OK')"

      # Run from the repo root so coverage.xml records repo-root relative paths
      # the SonarQube scanner can resolve (see services/nlp-service/.coveragerc).
      - name: Test with coverage (pytest)
        run: |
          python -m pytest -c services/nlp-service/pytest.ini services/nlp-service/tests \
            --cov \
            --cov-config=services/nlp-service/.coveragerc \
            --cov-report=xml:services/nlp-service/coverage.xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: services/nlp-service/coverage.xml
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Static analysis. Consumes the coverage the two test jobs produced rather
  # than re-running any tests.
  #
  # Requires two repository secrets; without them every step no-ops with a
  # warning so forks and secret-less PRs still get a green build:
  #   SONAR_TOKEN     - a SonarQube user or "Analyze project" token
  #   SONAR_HOST_URL  - e.g. https://sonarqube.internal.devlab.io
  # ---------------------------------------------------------------------------
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [node, python]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar reads history to attribute issues to authors and to work out
          # which lines are "new code" on a pull request.
          fetch-depth: 0

      - name: Download Node coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-node

      - name: Download Python coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-python
          path: services/nlp-service

      # Reads sonar-project.properties from the repo root; SONAR_TOKEN and
      # SONAR_HOST_URL come from the job-level env above.
      - name: Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8

      - name: Quality gate
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10

      - name: Report skip
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not set; skipping SonarQube analysis."

  # ---------------------------------------------------------------------------
  # Prove every image still builds. No registry push happens here.
  # ---------------------------------------------------------------------------
  docker:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [node]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            dockerfile: api-gateway/Dockerfile
          - image: developer-service
            dockerfile: services/developer-service/Dockerfile
          - image: skill-service
            dockerfile: services/skill-service/Dockerfile
          - image: analysis-service
            dockerfile: services/analysis-service/Dockerfile
          - image: recommendation-service
            dockerfile: services/recommendation-service/Dockerfile
          - image: notification-service
            dockerfile: services/notification-service/Dockerfile
          - image: nlp-service
            dockerfile: services/nlp-service/Dockerfile
          - image: web-client
            dockerfile: client/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Context is the repo root: this is an npm-workspaces monorepo with a
          # single root package-lock.json.
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: devlab/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # ---------------------------------------------------------------------------
  # Single required status check, so branch protection needs only one entry.
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [node, python, sonarqube, docker]
    if: always()
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo "node:      ${{ needs.node.result }}"
          echo "python:    ${{ needs.python.result }}"
          echo "sonarqube: ${{ needs.sonarqube.result }}"
          echo "docker:    ${{ needs.docker.result }}"
          [ "${{ needs.node.result }}" = "success" ] \
            && [ "${{ needs.python.result }}" = "success" ] \
            && [ "${{ needs.sonarqube.result }}" = "success" ] \
            && [ "${{ needs.docker.result }}" = "success" ]
