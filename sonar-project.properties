# ---------------------------------------------------------------------------
# SonarQube configuration for the devlab monorepo.
#
# Run locally:   npm run sonar:up
#                npm run test:cov && npm run test:python:cov
#                npm run sonar:scan
# Run in CI:     .github/workflows/ci.yml -> "sonarqube" job
#
# Coverage is NOT produced by the scanner. Jest and pytest must have run first;
# the scanner only reads the reports listed at the bottom of this file.
# ---------------------------------------------------------------------------

sonar.projectKey=devlab-platform
sonar.projectName=devlab Platform
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# What gets analysed
#
# Source roots are listed explicitly rather than using `sonar.sources=.`.
# Exclusions are applied *after* the file walk, so pointing the scanner at the
# repo root makes it descend into every workspace's node_modules first, which
# takes minutes and can appear to hang at "Preprocessing files...".
# ---------------------------------------------------------------------------

sonar.sources=\
  api-gateway/src,\
  services/analysis-service/src,\
  services/developer-service/src,\
  services/notification-service/src,\
  services/recommendation-service/src,\
  services/skill-service/src,\
  services/nlp-service/app,\
  services/nlp-service/main.py,\
  shared/types/src,\
  shared/utils/src,\
  client/web/app,\
  client/web/components,\
  client/web/hooks,\
  client/web/lib

# The source roots are re-listed here so co-located `*.spec.ts` files are
# indexed as tests. `sonar.exclusions` below keeps them out of the main set, so
# no file is ever indexed twice.
sonar.tests=\
  api-gateway/src,\
  services/analysis-service/src,\
  services/developer-service/src,\
  services/notification-service/src,\
  services/recommendation-service/src,\
  services/skill-service/src,\
  shared/utils/src,\
  client/web/lib,\
  services/nlp-service/tests

sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  services/nlp-service/tests/**/*.py

# client/web/components/ui is vendored shadcn/ui output. Issues there are not
# ours to fix and would otherwise dominate the maintainability rating.
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.d.ts,\
  **/migrations/**,\
  client/web/components/ui/**

# Wiring, schemas, DTOs and bootstrap files carry no branches worth measuring;
# counting them only dilutes the ratio without telling anyone anything.
sonar.coverage.exclusions=\
  **/*.module.ts,\
  **/main.ts,\
  **/*.entity.ts,\
  **/*.schema.ts,\
  **/*.dto.ts,\
  client/web/app/**,\
  client/web/components/**,\
  services/nlp-service/main.py

# ---------------------------------------------------------------------------
# Coverage reports
#
# Jest writes repo-root relative paths (see the `projectRoot` option in
# jest.preset.js) and pytest does the same via services/nlp-service/.coveragerc,
# so every path below resolves against this file's directory.
# ---------------------------------------------------------------------------

sonar.javascript.lcov.reportPaths=\
  api-gateway/coverage/lcov.info,\
  client/web/coverage/lcov.info,\
  services/analysis-service/coverage/lcov.info,\
  services/developer-service/coverage/lcov.info,\
  services/notification-service/coverage/lcov.info,\
  services/recommendation-service/coverage/lcov.info,\
  services/skill-service/coverage/lcov.info,\
  shared/utils/coverage/lcov.info

sonar.typescript.lcov.reportPaths=${sonar.javascript.lcov.reportPaths}

sonar.python.version=3.11
sonar.python.coverage.reportPaths=services/nlp-service/coverage.xml
