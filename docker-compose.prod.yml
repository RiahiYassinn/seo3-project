version: '3.8'

services:
  # Infrastructure Services
  postgres:
    image: postgres:15-alpine
    container_name: devlab-postgres
    environment:
      POSTGRES_USER: devlab_user
      POSTGRES_PASSWORD: devlab_password
      POSTGRES_DB: devlab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devlab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devlab_user -d devlab_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: devlab-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: devlab_user
      MONGO_INITDB_ROOT_PASSWORD: devlab_password
      MONGO_INITDB_DATABASE: devlab_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - devlab-network

  redis:
    image: redis:7-alpine
    container_name: devlab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - devlab-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: devlab-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - devlab-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: devlab-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - devlab-network

  # Application Services
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: devlab-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://devlab_user:devlab_password@postgres:5432/devlab_db
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - devlab-network

  developer-service:
    build:
      context: .
      dockerfile: services/developer-service/Dockerfile
    container_name: devlab-developer-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://devlab_user:devlab_password@postgres:5432/devlab_db
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - devlab-network

  skill-service:
    build:
      context: ./services/skill-service
      dockerfile: Dockerfile
    container_name: devlab-skill-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - MONGODB_URL=mongodb://devlab_user:devlab_password@mongodb:27017/devlab_analytics?authSource=admin
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - kafka
    networks:
      - devlab-network

  analysis-service:
    build:
      context: ./services/analysis-service
      dockerfile: Dockerfile
    container_name: devlab-analysis-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - MONGODB_URL=mongodb://devlab_user:devlab_password@mongodb:27017/devlab_analytics?authSource=admin
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - kafka
    networks:
      - devlab-network

  recommendation-service:
    build:
      context: ./services/recommendation-service
      dockerfile: Dockerfile
    container_name: devlab-recommendation-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://devlab_user:devlab_password@postgres:5432/devlab_db
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - devlab-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: devlab-notification-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://devlab_user:devlab_password@postgres:5432/devlab_db
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - devlab-network

  nlp-service:
    build:
      context: ./services/nlp-service
      dockerfile: Dockerfile
    container_name: devlab-nlp-service
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://devlab_user:devlab_password@mongodb:27017/devlab_analytics?authSource=admin
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - mongodb
      - kafka
    networks:
      - devlab-network

  web-client:
    build:
      context: ./client/web
      dockerfile: Dockerfile
    container_name: devlab-web-client
    ports:
      - "3010:3000"
    environment:
      - API_GATEWAY_URL=http://api-gateway:3000
    depends_on:
      - api-gateway
    networks:
      - devlab-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:

networks:
  devlab-network:
    driver: bridge
